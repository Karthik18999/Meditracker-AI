<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e63" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#e11d48" flood-opacity="0.4" />
    </filter>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Glowing Outer Accent Heart -->
  <path fill="url(#heartGrad)" filter="url(#shadow)" d="M 256, 455 C 120, 350 30, 245 30, 150 C 30, 75 85, 25 160, 25 C 205, 25 242, 52 256, 85 C 270, 52 307, 25 352, 25 C 427, 25 482, 75 482, 150 C 482, 245 392, 350 256, 455 Z" />

  <!-- Dynamic ECG Heartbeat Pulse Rate Line -->
  <path fill="none" stroke="url(#pulseGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" d="M 50, 235 L 165, 235 L 190, 185 L 220, 305 L 256, 125 L 292, 345 L 322, 195 L 345, 235 L 462, 235" />

  <!-- Vibrant Pulse Nodes -->
  <circle cx="256" cy="125" r="14" fill="#ffffff" />
  <circle cx="292" cy="345" r="12" fill="#ffffff" />
</svg>
